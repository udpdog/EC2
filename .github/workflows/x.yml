name: Build & Release EC2

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build EC2
        shell: powershell
        run: |
          .\build.ps1

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path ".\ec2.exe")) {
            throw "ec2.exe was not generated"
          }

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\ec2.exe#EC2 Windows x64" `
            --title "EC2 ${{ github.ref_name }}" `
            --generate-notes